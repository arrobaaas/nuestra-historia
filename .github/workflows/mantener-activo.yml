name: Mantener la base de datos activa

# Supabase (plan gratis) pausa los proyectos que pasan 7 días sin actividad.
# Este aviso automático consulta la base de datos dos veces por semana para que no se pause.
on:
  schedule:
    - cron: '0 12 * * 1,4'   # lunes y jueves, 12:00 UTC
  workflow_dispatch:          # también se puede ejecutar a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar la base de datos
        run: |
          URL=$(grep -oP 'supabaseUrl:\s*"\K[^"]+' config.js || true)
          KEY=$(grep -oP 'supabaseAnonKey:\s*"\K[^"]+' config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "config.js todavía no tiene los datos de Supabase; no hay nada que consultar."
            exit 0
          fi
          curl -fsS "$URL/rest/v1/fotos?select=id&limit=1" -H "apikey: $KEY" > /dev/null
          echo "Base de datos activa."
